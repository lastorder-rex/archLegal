<!doctype html>
<html lang="ko">
<head>

<meta property="og:description" content="실사 미니어처 위에서 위반 부위를 직접 눌러보고 내 집 양성화 가능성을 1분 만에 확인하세요." />

<style>
  :root{
    --ink:#19212b; --muted:#5b6772; --faint:#8b96a0;
    --line:rgba(25,33,43,.10); --line2:rgba(25,33,43,.16);
    --green:#15584a; --green2:#1d7a64; --amber:#cf8a2b; --red:#d8453a;
    --b:#1B64DA; --sc:#16A34A; --dg:#E5484D; --ts:#6B7684;
    --card:rgba(255,255,255,.92); --shadow:0 18px 50px -22px rgba(20,30,40,.45);
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif;
    --inv:1;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--sans); color:var(--ink);
    background:#cdd2da; overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none; -moz-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  input,textarea,[contenteditable="true"]{-webkit-user-select:text!important; user-select:text!important}
  #app{position:fixed; inset:0; overflow:hidden}

  /* ── viewport / image stage ───────────────────────────── */
  /* 여백(레터박스)을 이미지 양끝 배경과 동일하게: 좌=세로 회색, 우=세로 살구. 분할선은 중앙(이미지 뒤)에 숨김. */
  #viewport{position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none;
    background:
      linear-gradient(180deg,#776e68 0%, #cacfd9 40%, #cad1dd 100%) 0 0 / 50.5% 100% no-repeat,
      linear-gradient(180deg,#907f71 0%, #f3e3d4 42%, #eadbd2 100%) 100% 0 / 50.5% 100% no-repeat,
      #cdd2da}
  #viewport.grabbing{cursor:grabbing}
  #stage{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
  #stage img{display:block; width:100%; height:100%; -webkit-user-drag:none; user-drag:none; pointer-events:none}
  /* 적법 모습 크로스페이드 오버레이 — #stage 안이라 #bld와 동일한 팬/줌 transform이 그대로 적용됨 */
  #bldLegal{position:absolute; inset:0; opacity:0; transition:opacity .35s ease; z-index:1}

  /* ── pins (overlay, constant size) ────────────────────── */
  #pinlayer{position:absolute; inset:0; pointer-events:none; z-index:6}
  .pin{position:absolute; transform:translate(-50%,-50%); pointer-events:auto; cursor:pointer; border:0; background:none; padding:0}
  .pin .dot{
    width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    font-family:var(--sans); font-weight:800; font-size:12.5px; color:#fff;
    background:var(--c); box-shadow:0 3px 10px -2px rgba(20,30,40,.6), 0 0 0 3px #ffffffcc;
    transition:transform .15s ease; position:relative;
  }
  .pin:hover .dot,.pin.sel .dot{transform:scale(1.16)}
  .pin.sel .dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 32%,transparent),0 6px 16px -2px rgba(20,30,40,.6),0 0 0 3px #fff}
  .pin.sel .dot::after{content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--c); animation:ring 1.1s ease-out infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.9} 70%{transform:scale(1.5);opacity:0} 100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .pin.sel .dot::after{animation:none;opacity:0} }
  .pin.roof{--c:#e24438} .pin.facade{--c:#e6902a} .pin.ground{--c:#12a594} .pin.site{--c:#7a5cf0}
  .pin.dim{opacity:.16; pointer-events:none}
  .pin.hide{display:none}

  /* ── 씬 미니어처 (qna3d와 동일: 캐릭터 + 말풍선) ── */
  .scene-fig{position:absolute; z-index:7; pointer-events:none; transform:translate(-50%,-100%);
    transform-origin:50% 100%; display:flex; flex-direction:column; align-items:center; gap:3px}
  .scene-fig .mini-bubble, .scene-fig .mini-fig{pointer-events:auto; cursor:pointer}
  .scene-fig.deco .mini-bubble, .scene-fig.deco .mini-fig{pointer-events:none; cursor:default}
  .mini-bubble{display:inline-flex; align-items:center; gap:7px; background:#fff; color:var(--ink);
    border:1px solid var(--line); border-radius:12px; padding:6px 11px; font-size:12px; font-weight:800;
    white-space:nowrap; box-shadow:var(--shadow); position:relative}
  .mini-bubble::after{content:""; position:absolute; left:50%; bottom:-5px; margin-left:-5px; width:10px; height:10px;
    background:#fff; border-right:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg)}
  .mini-bubble.calm{background:var(--b); color:#fff; border-color:var(--b); animation:calmGlow 1.5s ease-out infinite, calmPop 1.5s ease-in-out infinite}
  .mini-bubble.calm::after{background:var(--b); border-color:var(--b)}
  .mini-bubble.yellow{background:#fee500; color:#111; border-color:#fee500; animation:shareGlow 1.6s ease-out infinite}
  .mini-bubble.yellow::after{background:#fee500; border-color:#fee500}
  .mini-bubble:hover{filter:brightness(1.04)}
  .ktalk{display:inline-flex; align-items:center; justify-content:center; width:27px; height:16px; border-radius:999px;
    background:#111; color:#fee500; font-size:7.5px; font-weight:900; letter-spacing:.4px; flex:0 0 27px}
  .mini-fig{height:62px; width:auto; filter:drop-shadow(0 6px 8px rgba(20,30,40,.35))}
  .mini-fig.lego{height:76px}
  .mini-fig.lego.sm{height:70px}
  @keyframes shareGlow{0%{box-shadow:0 0 0 0 rgba(254,229,0,.7)} 70%{box-shadow:0 0 0 11px rgba(254,229,0,0)} 100%{box-shadow:0 0 0 0 rgba(254,229,0,0)}}
  @keyframes calmGlow{0%{box-shadow:0 0 0 0 rgba(27,100,218,.45)} 65%{box-shadow:0 0 0 12px rgba(27,100,218,0)} 100%{box-shadow:0 0 0 0 rgba(27,100,218,0)}}
  @keyframes calmPop{0%,100%{transform:scale(1)} 50%{transform:scale(1.035)}}
  @media (max-width:560px){
    .scene-fig{gap:2px}
    .mini-fig{height:30px}
    .mini-fig.lego{height:38px}
    .mini-fig.lego.sm{height:36px}
    .mini-bubble{font-size:9px; padding:3px 7px; gap:5px; border-radius:9px}
    .mini-bubble::after{width:8px; height:8px; bottom:-4px; margin-left:-4px}
    .ktalk{width:19px; height:11px; font-size:6px; flex:0 0 19px}
    /* 좁은 폭: 말풍선 3개가 겹치므로 핵심 CTA(자가진단)만 남기고 장식·공유 말풍선은 숨김(캐릭터는 유지) */
    #miniThink .mini-bubble, #shareMini .mini-bubble{display:none}
  }

  /* ── header ───────────────────────────────────────────── */
  header.bar{position:absolute; top:0; left:0; right:0; z-index:8; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:13px 18px; background:linear-gradient(#11161cd0,#11161c50 60%,#11161c00); color:#fff}
  .brand{display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; color:inherit; cursor:pointer}
  .brand .logo{width:34px;height:34px;flex:none;object-fit:contain;display:block}
  /* 전체 메뉴(글로벌 내비) 슬라이드 */
  .navov{position:fixed; inset:0; z-index:80; display:none}
  .navov.show{display:block}
  .navov .nbg{position:absolute; inset:0; background:rgba(20,28,36,.45); backdrop-filter:blur(2px); animation:navfade .2s ease}
  @keyframes navfade{from{opacity:0}to{opacity:1}}
  .navsheet{position:absolute; top:0; right:0; height:100%; width:min(300px,86vw); background:#fff; box-shadow:-18px 0 50px -24px rgba(20,30,40,.5); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .28s cubic-bezier(.2,.7,.3,1)}
  .navov.show .navsheet{transform:none}
  .navhead{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line)}
  .navhead b{font-size:15px; font-weight:800; color:var(--ink)}
  .navx{appearance:none; border:1px solid var(--line2); background:#fff; width:34px; height:34px; border-radius:10px; cursor:pointer; font-size:14px; color:var(--muted)}
  .navlist{display:flex; flex-direction:column; padding:12px; gap:2px; overflow-y:auto}
  .navlist a{display:flex; align-items:center; gap:11px; padding:13px 12px; border-radius:11px; text-decoration:none; color:var(--ink); font-size:15px; font-weight:700}
  .navlist a:hover{background:#f3f6f9}
  .navlist a.cur{background:#eef6f2; color:var(--green2)}
  .navlist a svg{width:19px; height:19px; color:var(--muted); flex:none}
  .navlist a.cur svg{color:var(--green2)}
  .navlist a.login{margin-top:8px; justify-content:center; border:1px solid var(--line2)}
  .brand h1{margin:0;font-size:15px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand h1 b{color:#7fe3cf}
  .brand p{margin:2px 0 0;font-size:11.5px;color:#c5cdd6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools{display:flex;gap:8px;flex:none}
  .tbtn{appearance:none;border:1px solid #ffffff33;background:#ffffff14;color:#fff;border-radius:11px;padding:9px 12px;
    font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(6px)}
  .tbtn:hover{background:#ffffff24}
  .tbtn.on{background:var(--green); border-color:var(--green); color:#fff; box-shadow:0 6px 16px -8px rgba(21,88,74,.8)}
  /* .tbtn 이 display:inline-flex 라 UA의 [hidden]{display:none}가 눌린다 → 명시적으로 숨김 보장 */
  .tbtn[hidden]{display:none}
  .tbtn .ic{width:15px;height:15px;display:block}
  /* 보기 전환(다른 버전으로 이동) — 강조 */
  .tbtn-switch{background:#fff;color:#16261f;border-color:#fff;text-decoration:none}
  .tbtn-switch:hover{background:#eef2f5}

  /* ── hint ─────────────────────────────────────────────── */
  .hint{position:absolute; top:74px; left:18px; z-index:7; max-width:300px; background:var(--card); backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow)}
  .hint b{display:block;font-size:14.5px;font-weight:800;margin-bottom:5px}
  .hint p{margin:0;font-size:12px;line-height:1.55;color:var(--muted)}
  .hint .count{display:inline-flex;align-items:baseline;gap:5px;margin-top:9px;color:var(--green);font-weight:800}
  .hint .count b{display:inline;font-size:18px}
  .hint .count span{font-size:11.5px;color:var(--muted);font-weight:600}

  /* ── case rail / filters ──────────────────────────────── */
  .rail-wrap{position:absolute; left:0; right:0; bottom:0; z-index:7; padding:14px 16px 18px;
    background:linear-gradient(0deg,#11161ccc,#11161c80 55%,#11161c00)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .fbtn{appearance:none;border:1px solid #ffffff30;background:#ffffff16;color:#e7edf3;cursor:pointer;font-family:inherit;
    border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
  .fbtn.on{background:#fff;border-color:#fff;color:#16261f}
  .fbtn[data-f]:not([data-f="all"])::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
  .fbtn[data-f="roof"]::before{background:#e24438}
  .fbtn[data-f="facade"]::before{background:#e6902a}
  .fbtn[data-f="ground"]::before{background:#12a594}
  .fbtn[data-f="site"]::before{background:#7a5cf0}
  .rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;cursor:grab;scroll-behavior:smooth}
  .rail::-webkit-scrollbar{display:none}
  .rail.grabbing{cursor:grabbing;scroll-behavior:auto}
  .chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid #ffffff2a;background:#ffffff14;color:#eef3f8;
    border-radius:12px;padding:8px 12px 8px 9px;font-size:12.5px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap}
  .chip .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--c)}
  .chip.roof{--c:#e24438}.chip.facade{--c:#e6902a}.chip.ground{--c:#12a594}.chip.site{--c:#7a5cf0}
  .chip.sel{background:#fff;color:#16261f;border-color:#fff}
  .chip.hide{display:none}

  /* ── detail panel ─────────────────────────────────────── */
  #panel{position:absolute;top:0;right:0;z-index:9;width:380px;max-width:92vw;height:100%;overflow-y:auto;
    background:#fff;box-shadow:-18px 0 50px -24px rgba(20,30,40,.5);
    transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.3,1);padding:0 0 28px}
  #panel.show{transform:none}
  .ph{position:sticky;top:0;z-index:2;background:#fff;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
  .ph .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ph .chiprow{display:flex;align-items:center;gap:8px}
  .ph .num{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:var(--c)}
  .ph .zone{font-size:11.5px;font-weight:800;color:var(--c);letter-spacing:.2px}
  .ph h2{margin:8px 0 0;font-size:20px;font-weight:800;letter-spacing:-.3px}
  .ph .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .ph .tag{font-size:11px;font-weight:700;color:var(--muted);background:#f1f3f5;border-radius:999px;padding:3px 9px}
  .pclose{appearance:none;border:1px solid var(--line2);background:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--muted);flex:none}
  .pbody{padding:16px 20px 0}
  .sec{margin-top:18px}
  .sec h4{margin:0 0 9px;font-size:12px;font-weight:800;color:var(--faint);letter-spacing:.4px;text-transform:uppercase}
  .lead{font-size:14.5px;font-weight:700;line-height:1.55;color:var(--ink);margin:0 0 8px}
  .ex{font-size:13px;line-height:1.65;color:var(--muted);margin:0;background:#f7f8f9;border-radius:12px;padding:12px 14px}
  .qa{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .qa .q{font-size:13.5px;font-weight:800;color:var(--ink);margin:0 0 6px;display:flex;gap:7px}
  .qa .q .qm{color:var(--b);flex:none}
  .qa .a{font-size:12.5px;line-height:1.6;color:var(--muted);margin:0}
  .qa .refs{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
  .qa .ref{font-size:10.5px;font-weight:700;color:var(--green2);background:#eaf5f0;border-radius:6px;padding:2px 7px}
  .cta{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .cta a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:13px;font-size:15px;font-weight:800;text-decoration:none}
  .cta .prim{background:var(--b);color:#fff}
  .cta .ghost{border:1px solid var(--line2);color:var(--ink);background:#fff}
  .foot{font-size:11px;line-height:1.6;color:var(--faint);margin:18px 20px 0}

  /* ── mobile ───────────────────────────────────────────── */
  @media (max-width:560px){
    header.bar{padding:11px 13px}
    .brand h1{font-size:13px} .brand p{display:none}
    .tbtn span{display:none} .tbtn{padding:9px}
    .hint{top:64px;left:12px;right:12px;max-width:none;padding:10px 13px;border-radius:13px}
    .hint b{font-size:12.5px;margin-bottom:0} .hint p{display:none}
    #panel{top:auto;bottom:0;height:auto;max-height:84vh;width:auto;max-width:none;left:0;right:0;border-radius:20px 20px 0 0;
      transform:translateY(102%)}
    #panel.show{transform:none}
  }
  /* ── 자가진단 스토리 오버레이 (qna3d와 동일) ── */
  .story-ov{position:fixed; inset:0; z-index:50; display:none; align-items:flex-end; justify-content:center; background:rgba(20,28,36,.4); backdrop-filter:blur(2px);
    --b:#1B64DA; --bp:#1554B8; --sbg:#F7F8FA; --sf:#fff; --tp:#191F28; --ts:#6B7684; --bd:#E5E8EB; --dg:#E5484D; --sc:#16A34A; --wbg:#FFF8E7}
  .story-ov.show{display:flex; animation:fadein .2s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .story{width:min(440px,100%); max-height:90vh; display:flex; flex-direction:column; background:var(--sbg); border-radius:20px 20px 0 0; box-shadow:0 -20px 60px -20px rgba(20,30,40,.5); overflow:hidden; animation:slideup .28s cubic-bezier(.2,.7,.3,1); font-family:var(--sans)}
  @media(min-width:560px){ .story-ov{align-items:center} .story{border-radius:20px; max-height:84vh} }
  @keyframes slideup{from{transform:translateY(28px); opacity:.5}to{transform:none; opacity:1}}
  .story-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 16px; background:var(--b); color:#fff}
  .guide{display:flex; align-items:center; gap:10px}
  .guide .ga{width:34px;height:34px;border-radius:50%;background:#ffffff2e;display:grid;place-items:center;font-size:18px}
  .guide b{display:block; font-size:14px; font-weight:800} .guide i{font-style:normal; font-size:11px; opacity:.85}
  .story-x{appearance:none;border:0;background:#ffffff2e;color:#fff;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px}
  .sbody{flex:1; overflow:auto; padding:18px 18px 22px}
  .sbody::-webkit-scrollbar{width:7px}.sbody::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
  .pbar{height:6px; border-radius:3px; background:var(--bd); overflow:hidden}
  .pbar>i{display:block; height:100%; background:var(--b); border-radius:3px; transition:width .3s ease}
  .pstep{font-size:12px; font-weight:700; color:var(--ts); margin-top:8px}
  .sbadge{display:inline-block; font-size:12px; font-weight:800; color:var(--b); background:var(--wbg); border-radius:999px; padding:5px 11px; margin-top:14px}
  .stitle{font-size:20px; font-weight:800; color:var(--tp); margin:12px 0 0; line-height:1.4; word-break:keep-all}
  .sdesc{font-size:14px; color:var(--ts); margin:8px 0 0; line-height:1.5; word-break:keep-all}
  .shint{background:var(--wbg); border:1px solid var(--dg); border-radius:10px; padding:11px 12px; margin-top:13px; font-size:13px; color:var(--tp); line-height:1.5}
  .opts{display:flex; flex-direction:column; gap:10px; margin-top:16px}
  .opt{display:flex; align-items:center; gap:12px; background:var(--sf); border:1px solid var(--bd); border-radius:12px; padding:13px 14px; cursor:pointer; text-align:left; font-family:inherit; transition:.14s; width:100%}
  .opt:hover{border-color:var(--b); background:#f4f8ff}
  .opt .oic{width:40px;height:40px;border-radius:50%; border:1.5px solid var(--ts); display:grid; place-items:center; font-size:16px; font-weight:800; flex:none; color:var(--ts)}
  .opt .oic.yes{border-color:var(--sc); color:var(--sc)} .opt .oic.no,.opt .oic.danger{border-color:var(--dg); color:var(--dg)} .opt .oic.warn{border-color:var(--b); color:var(--b)}
  .opt .oic svg{width:18px;height:18px}

  {id:15, q:'이행강제금은 얼마나, 몇 번 나오나요?', a:'일반 이행강제금은 시가표준액·위반면적·요율로 산정되고, 시정 전까지 반복 부과될 수 있습니다. 특별조치법 적용 대상이 사용승인을 받는 경우에는 이행강제금 5회분 기준의 과태료가 문제되며, 이미 5회 미만 납부한 이력이 있으면 그 납부액을 차감하는 방식으로 계산됩니다.', refs:['건축법 제80조','특별조치법 제9조']},

];
const VMAP = Object.fromEntries(VIOLATIONS.map(v=>[v.id,v]));
const QMAP = Object.fromEntries(QNA.map(x=>[x.id,x]));
const ZONE_LABEL = {roof:'옥상부', facade:'외벽·발코니', ground:'1층·주차·용도', site:'구조·세대·대지'};
const ZONE_COLOR = {roof:'#e24438', facade:'#e6902a', ground:'#12a594', site:'#7a5cf0'};

/* ===================== 이미지 팬/줌 엔진 ===================== */
const IW=1536, IH=1024;
const vpEl=document.getElementById('viewport');
const stageEl=document.getElementById('stage');
const pinLayer=document.getElementById('pinlayer');
const root=document.documentElement;
let fitW=IW, fitH=IH, MIN=1, MAX=5;
let st={s:1, tx:0, ty:0};
let anim=null;

function computeFit(){
  const vw=vpEl.clientWidth, vh=vpEl.clientHeight;
  const f=Math.min(vw/IW, vh/IH); // contain: 전체가 항상 보이게(배경색이 이미지 배경과 동일)
  fitW=IW*f; fitH=IH*f;
  stageEl.style.width=fitW+'px'; stageEl.style.height=fitH+'px';
}
function clampPan(){
  const vw=vpEl.clientWidth, vh=vpEl.clientHeight;
  const w=fitW*st.s, h=fitH*st.s;
  if(w<=vw) st.tx=(vw-w)/2; else st.tx=Math.min(0, Math.max(vw-w, st.tx));
  if(h<=vh) st.ty=(vh-h)/2; else st.ty=Math.min(0, Math.max(vh-h, st.ty));
}
function apply(){
  stageEl.style.transform=`translate(${st.tx}px,${st.ty}px) scale(${st.s})`;
  // 핀 위치 갱신(고정 크기)
  for(const p of pinEls){
    const v=VMAP[p.dataset.id];
    p.style.left=(st.tx + v.x*fitW*st.s)+'px';
    p.style.top =(st.ty + v.y*fitH*st.s)+'px';
  }
  document.querySelectorAll('.scene-fig').forEach(el=>{
    el.style.left=(st.tx + (+el.dataset.x)*fitW*st.s)+'px';
    el.style.top =(st.ty + (+el.dataset.y)*fitH*st.s)+'px';
    el.style.transform='translate(-50%,-100%) scale('+st.s+')'; // 건물과 동일 배율로 확대
  });
}
function setView(s, tx, ty){ st.s=Math.min(MAX,Math.max(MIN,s)); st.tx=tx; st.ty=ty; clampPan(); apply(); }
function resetView(){
  computeFit(); cancelAnim();
  // 모바일: 기본 250%(2.5배) 확대로 시작 — 세로 화면을 채우게. 데스크톱은 contain-fit(1배).
  st.s = (window.innerWidth<=560 ? 2.5 : 1);
  const vw=vpEl.clientWidth, vh=vpEl.clientHeight;
  st.tx=(vw - fitW*st.s)/2; st.ty=(vh - fitH*st.s)/2;
  clampPan(); apply();
}

function zoomAt(cx, cy, factor){
  const ns=Math.min(MAX, Math.max(MIN, st.s*factor));
  if(ns===st.s) return;
  const u=(cx-st.tx)/st.s, v=(cy-st.ty)/st.s;
  st.s=ns; st.tx=cx-u*ns; st.ty=cy-v*ns; clampPan(); apply();
}

// 부드러운 포커스 이동(핀 선택 시)
function cancelAnim(){ if(anim){ cancelAnimationFrame(anim); anim=null; } }
function focusPin(v, targetS){
  cancelAnim();
  const vw=vpEl.clientWidth, vh=vpEl.clientHeight;
  const panelW = (window.innerWidth>560 ? Math.min(380, window.innerWidth*0.92) : 0);
  const cx=(vw - panelW)/2, cy=window.innerWidth>560 ? vh*0.5 : vh*0.4;
  const ts=Math.min(MAX, targetS||2.1);
  const ttx=cx - v.x*fitW*ts, tty=cy - v.y*fitH*ts;
  const s0=st.s,tx0=st.tx,ty0=st.ty; let t=0;
  const step=()=>{
    t+=0.08; const k=t>=1?1:(1-Math.pow(1-t,3));
    st.s=s0+(ts-s0)*k; st.tx=tx0+(ttx-tx0)*k; st.ty=ty0+(tty-ty0)*k; clampPan(); apply();
    if(t<1) anim=requestAnimationFrame(step); else anim=null;
  };
  anim=requestAnimationFrame(step);
}

/* ── 포인터: 드래그 팬 + 핀치 줌 ── */
const pointers=new Map(); let lastMid=null, lastDist=0, dragged=false, downXY=null;
vpEl.addEventListener('pointerdown', e=>{
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  vpEl.setPointerCapture(e.pointerId);
  dragged=false; downXY={x:e.clientX,y:e.clientY}; cancelAnim();
  if(pointers.size===1) vpEl.classList.add('grabbing');
  if(pointers.size===2){ const p=[...pointers.values()]; lastDist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); lastMid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}; }
});
vpEl.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    if(Math.abs(e.clientX-downXY.x)+Math.abs(e.clientY-downXY.y)>4) dragged=true;
    st.tx+=dx; st.ty+=dy; clampPan(); apply();
  } else if(pointers.size===2){
    const p=[...pointers.values()];
    const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    const mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
    if(lastDist) zoomAt(mid.x, mid.y, dist/lastDist);
    lastDist=dist; lastMid=mid; dragged=true;
  }
});
function upPointer(e){ pointers.delete(e.pointerId); if(pointers.size<2) lastDist=0; if(pointers.size===0) vpEl.classList.remove('grabbing'); }
vpEl.addEventListener('pointerup', upPointer);
vpEl.addEventListener('pointercancel', upPointer);
vpEl.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY<0?1.16:1/1.16); }, {passive:false});

/* ===================== 핀 + 레일 + 필터 ===================== */
const pinEls=[];
let selected=null, filter='all', showLegal=false;
VIOLATIONS.forEach(v=>{
  const b=document.createElement('button');
  b.className='pin '+v.zone; b.dataset.id=v.id; b.dataset.zone=v.zone;
  b.setAttribute('aria-label', v.no+' '+v.title);
  b.innerHTML=`<span class="dot">${v.no}</span>`;
  b.addEventListener('click', ev=>{ ev.stopPropagation(); select(v.id); });
  pinLayer.appendChild(b); pinEls.push(b);
});

const railEl=document.getElementById('rail');
VIOLATIONS.forEach(v=>{
  const c=document.createElement('button');
  c.className='chip '+v.zone; c.dataset.id=v.id; c.dataset.zone=v.zone;
  c.innerHTML=`<span class="n">${v.no}</span>${v.title}`;
  c.addEventListener('click', ()=>{ if(!railDragged) select(v.id); });
  railEl.appendChild(c);
});

function applyFilter(){
  pinEls.forEach(p=>{
    p.classList.toggle('hide', showLegal);            // 적법 모습이면 핀 전부 숨김
    const on = filter==='all' || p.dataset.zone===filter;
    p.classList.toggle('dim', !showLegal && !on && p.dataset.id!==selected);
  });
  [...railEl.children].forEach(c=>{ const on = filter==='all' || c.dataset.zone===filter; c.classList.toggle('hide', !on); });
}
document.getElementById('filters').addEventListener('click', e=>{
  const b=e.target.closest('.fbtn'); if(!b) return;
  filter=b.dataset.f;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
  applyFilter();
});

function select(id){
  const v=VMAP[id]; if(!v) return;
  clearLegal();                          // 적법 모습 ON 상태에서 위반 선택 시 자동 해제
  selected=id;
  pinEls.forEach(p=>p.classList.toggle('sel', p.dataset.id===id));
  [...railEl.children].forEach(c=>c.classList.toggle('sel', c.dataset.id===id));
  applyFilter();
  renderPanel(v);
  focusPin(v, 2.1);
}

function renderPanel(v){
  const col=ZONE_COLOR[v.zone];
  const qas=v.qa.map(qid=>QMAP[qid]).filter(Boolean);
  const tags=(v.tags||[]).map(t=>`<span class="tag">#${t}</span>`).join('');
  const qaHtml=qas.map(q=>`<div class="qa"><p class="q"><span class="qm">Q.</span><span>${q.q}</span></p><p class="a">${q.a}</p><div class="refs">${q.refs.map(r=>`<span class="ref">${r}</span>`).join('')}</div></div>`).join('');
  // 위반 10·11이고 내부 실사 에셋이 준비된 경우에만 '내부 실사 보기' 버튼(연결 Q&A 위) 노출
  const interiorBtn = interiorReady[v.no]
    ? `<div class="sec"><button class="p-interior" id="pinterior" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>내부 실사 보기</button></div>`
    : '';
  panel.style.setProperty('--c', col);
  panel.innerHTML=`
    <div class="ph" style="--c:${col}">
      <div class="top">
        <div class="chiprow"><span class="num">${v.no}</span><div><div class="zone">${ZONE_LABEL[v.zone]}</div><h2>${v.title}</h2></div></div>
        <button class="pclose" id="pclose" aria-label="닫기">✕</button>
      </div>
      <div class="tags">${tags}</div>
    </div>
    <div class="pbody">
      <div class="sec"><h4>흔한 적발 사례</h4><p class="lead">${v.short}</p><p class="ex">${v.example}</p></div>
      ${interiorBtn}
      <div class="sec"><h4>연결 Q&amp;A</h4>${qaHtml}</div>
      <div class="cta">
        <a class="prim" id="pconsult" role="button" tabindex="0" style="cursor:pointer">이 위반, 전문가 무료 상담</a>
        <a class="ghost" href="/calc">이행강제금 계산하기</a>
      </div>
      <p class="foot">공공데이터·건축법 기준 1차 정보입니다. 최종 양성화 가능 여부는 건축사 현장검토와 관할 지자체 기준에 따라 달라질 수 있습니다.</p>
    </div>`;
  document.getElementById('pclose').addEventListener('click', closePanel);

    <div class="stitle">${q.title||''}</div>

    onClick:()=>dxGo([...answers, {questionId:q.id, optionId:o.id}])

    try{

}
async function renderReport(a){
  foot('※ 공공데이터 기반 1차 정보입니다. 최종 양성화 가능 여부는 건축사 현장검토·관할 지자체 기준에 따라 달라질 수 있어요.');
  sbody.innerHTML='<p class="typing">건축물대장·위반등재 조회 중…</p>';
  const code4={...a.addressCode, bun:String(a.addressCode.bun).padStart(4,'0'), ji:String(a.addressCode.ji).padStart(4,'0')};
  let v=null,b=null;
  try{
    const [vr,tr]=await Promise.allSettled([
      fetch('/api/building/violation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addressCode:code4})}).then(r=>r.json()),
      fetch('/api/building/title',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a.addressCode)}).then(r=>r.json()),
    ]);
    v=vr.status==='fulfilled'&&vr.value&&vr.value.ok?(vr.value.violation??null):null;
    b=tr.status==='fulfilled'&&tr.value?tr.value.building:null;
  }catch(_){}
  const vd = v===true?{c:'#E5484D',chip:'위반건축물 등재',title:'위반건축물로 등재돼 있어요',copy:'건축물대장에 위반 표시가 있어요. 한시법 기간 안에 양성화를 검토하는 게 유리해요.'}
    : v===false?{c:'#16A34A',chip:'등재 미확인',title:'위반 등재가 확인되지 않아요',copy:'다만 ‘합법’ 확정은 아니에요 — 일부 지역은 위반정보가 제공되지 않으니 도면 대조·자가진단으로 한 번 더 확인하길 권해요.'}
    : {c:'#6B7684',chip:'조회 불가',title:'이 주소는 조회되지 않았어요',copy:'주소를 특정하지 못했거나 해당 지역 위반정보가 제공되지 않을 수 있어요.'};
  const fa=(x=>{const n=Number(x);return(!n||isNaN(n))?'정보없음':Math.round(n).toLocaleString()+'㎡';})(b&&b.totArea);
  const g=b&&(b.groundFloorCnt??b.grndFlrCnt),u=b&&b.ugrndFloorCnt; const floors=g!=null?`지상 ${g}층${u?` · 지하 ${u}층`:''}`:'정보없음';
  const dday=Math.max(0,Math.ceil((new Date('2028-06-16T23:59:59+09:00').getTime()-Date.now())/86400000));
  sbody.innerHTML = `<span class="rchip" style="background:${vd.c}">${vd.chip}</span>
    <div class="rttl">${vd.title}</div>
    <div class="rcopy">${vd.copy}</div>
    <div class="rbox"><h5>내 건물 리포트</h5><div class="rmeta2">${ICONS.pin} ${a.roadAddr}${a.buildingName?` (${a.buildingName})`:''}<br>${ICONS.store} 주용도 ${b&&b.mainPurpsCdNm?b.mainPurpsCdNm:'정보없음'} · 연면적 ${fa} · ${floors}<br>${ICONS.clock} 특별조치법 신청 마감 D-${dday.toLocaleString()}</div></div>`;
  sbody.appendChild(primaryBtn(`${ICONS.msg} 이 건물, 전문가 무료 상담`, ()=>openConsult(`[내 건물 진단] ${a.roadAddr}\n위 건물 위반건축물 양성화 상담을 요청합니다.`)));
  sbody.appendChild(ghostBtn(`${ICONS.calc} 이행강제금 계산하기`, ()=>location.href='/calc'));
  const links=document.createElement('div'); links.className='slinks';
  const other=document.createElement('span'); other.className='slink'; other.textContent='다른 주소'; other.onclick=renderAddr;
  links.appendChild(other); sbody.appendChild(links);
  sbody.scrollTop=0;
}

/* init */
function boot(){ computeFit(); resetView(); }
window.addEventListener('resize', ()=>{ const wasFit=Math.abs(st.s-1)<0.01; computeFit(); if(wasFit) resetView(); else { clampPan(); apply(); } });
if(document.getElementById('bld').complete) boot();
else document.getElementById('bld').addEventListener('load', boot);
boot();
</script>
