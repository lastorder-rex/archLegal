<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>양성화.com — 위반건축물 3D 입체 진단맵 (LAB)</title>
<meta name="robots" content="noindex,nofollow" />
<style>
  :root{
    --ink:#19212b; --muted:#5b6772; --faint:#8b96a0;
    --line:rgba(25,33,43,.10); --line2:rgba(25,33,43,.16);
    --green:#15584a; --green2:#1d7a64; --amber:#cf8a2b; --red:#d8453a;
    --card:rgba(255,255,255,.86); --glass:rgba(255,255,255,.72);
    --mono:'SF Mono',ui-monospace,'Roboto Mono',Menlo,monospace;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif;
    --shadow:0 18px 50px -22px rgba(20,30,40,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--sans); color:var(--ink);
    background:
      radial-gradient(120% 90% at 70% 8%, #f4f6f7 0%, #eceef0 38%, #e3e0d8 78%, #dcd7cd 100%);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column}

  /* ── header ───────────────────────────────────────────── */
  header.bar{
    position:relative; z-index:6; display:flex; align-items:center; gap:14px;
    padding:14px 20px; background:linear-gradient(#ffffffd9,#ffffff66 60%,#ffffff00);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .brand .logo{
    width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--green),#0e3f35); color:#fff; box-shadow:0 6px 16px -6px rgba(21,88,74,.7);
  }
  .brand h1{font-size:15px; font-weight:800; letter-spacing:-.2px; margin:0; line-height:1.1}
  .brand h1 b{color:var(--green)}
  .brand p{margin:1px 0 0; font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.2px}
  .bar .spacer{flex:1}
  .tools{display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end}
  .tbtn{
    appearance:none; border:1px solid var(--line2); background:#fff; color:var(--ink);
    font-family:inherit; font-weight:700; font-size:12.5px; border-radius:999px;
    padding:8px 13px; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    transition:.16s ease; white-space:nowrap; box-shadow:0 1px 2px rgba(20,30,40,.04);
  }
  .tbtn:hover{border-color:var(--green2); color:var(--green)}
  .tbtn .ic{width:15px;height:15px;display:block}
  .tbtn.on{background:var(--green); border-color:var(--green); color:#fff; box-shadow:0 6px 16px -8px rgba(21,88,74,.8)}

  /* ── stage ────────────────────────────────────────────── */
  #stage{position:relative; flex:1; min-height:0}
  #gl{position:absolute; inset:0; display:block; touch-action:none}
  #labels{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:4}
  #labels > *{pointer-events:auto}

  .pin{
    --c:var(--red);
    transform:translate(-50%,-50%); cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:0; transition:opacity .25s ease;
  }
  .pin .dot{
    width:27px;height:27px;border-radius:50%;flex:none; display:grid;place-items:center;
    font-family:var(--mono); font-weight:700; font-size:12px; color:#fff; background:var(--c);
    border:2px solid #fff; box-shadow:0 4px 12px -2px rgba(20,30,40,.5), 0 0 0 1px rgba(20,30,40,.06);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .pin .tip{
    margin-left:7px; background:#fff; color:var(--ink); font-size:11.5px; font-weight:700;
    padding:4px 9px; border-radius:999px; white-space:nowrap; box-shadow:var(--shadow);
    border:1px solid var(--line); opacity:0; transform:translateX(-6px); transition:.16s ease; pointer-events:none;
  }
  .pin:hover .dot,.pin.sel .dot{transform:scale(1.16)}
  .pin:hover .tip{opacity:1; transform:translateX(0)}
  .pin.sel .dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent),0 6px 16px -2px rgba(20,30,40,.55)}
  .pin.sel .dot::after{content:""; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--c);
    animation:selPulse 1.15s ease-out infinite}
  @keyframes selPulse{0%{opacity:.8; transform:scale(1)} 70%{opacity:0; transform:scale(1.85)} 100%{opacity:0; transform:scale(1.85)}}
  @media (prefers-reduced-motion: reduce){ .pin.sel .dot::after{animation:none; opacity:0} }
  .pin.amber{--c:var(--amber)} .pin.red{--c:var(--red)}
  .pin.dim{opacity:.14; pointer-events:none}
  .pin.hide{display:none}

  .think{transform:translate(-50%,-100%); background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:5px 11px; font-size:11.5px; font-weight:800; color:var(--ink); box-shadow:var(--shadow);
    white-space:nowrap; pointer-events:none !important; position:relative}
  .think::after{content:""; position:absolute; left:16px; bottom:-5px; width:10px; height:10px; background:#fff;
    border-right:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg)}
  .think.calm{background:var(--green); color:#fff; border-color:var(--green)}
  .think.calm::after{background:var(--green); border-color:var(--green)}
  .pin .dot{position:relative}

  /* ── case rail ────────────────────────────────────────── */
  .rail-wrap{position:absolute; left:0; right:0; bottom:0; z-index:5; padding:12px 16px 16px;
    background:linear-gradient(#ffffff00,#ffffffcc 55%); }
  .rail{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; cursor:grab; scroll-behavior:smooth}
  .rail::-webkit-scrollbar{display:none}
  .rail.grabbing{cursor:grabbing; scroll-behavior:auto; user-select:none}
  .rail-wrap{position:absolute}
  .rail-wrap::before,.rail-wrap::after{content:""; position:absolute; bottom:16px; width:34px; height:42px; pointer-events:none; z-index:1}
  .rail-wrap::before{left:16px; background:linear-gradient(90deg,#fff,transparent)}
  .rail-wrap::after{right:16px; background:linear-gradient(270deg,#fff,transparent)}
  .chip{
    flex:none; appearance:none; border:1px solid var(--line2); background:#fff; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:12.5px; color:var(--ink); border-radius:999px;
    padding:8px 13px 8px 9px; display:inline-flex; align-items:center; gap:7px; transition:.16s ease;
    box-shadow:0 1px 2px rgba(20,30,40,.05);
  }
  .chip .n{font-family:var(--mono); font-size:11px; color:#fff; background:var(--faint);
    width:20px;height:20px;border-radius:6px;display:grid;place-items:center; flex:none}
  .chip[data-cat="red"] .n{background:var(--red)} .chip[data-cat="amber"] .n{background:var(--amber)}
  .chip:hover{border-color:var(--green2)}
  .chip.sel{background:var(--green); border-color:var(--green); color:#fff}
  .chip.sel .n{background:rgba(255,255,255,.25)}
  .chip.dim{opacity:.38}

  .filters{display:flex; gap:7px; margin-bottom:10px; flex-wrap:wrap}
  .fbtn{appearance:none;border:1px solid var(--line2); background:#ffffffcc; cursor:pointer; font-family:inherit;
    font-weight:700; font-size:12px; color:var(--muted); border-radius:999px; padding:6px 12px; transition:.16s}
  .fbtn:hover{color:var(--green)}
  .fbtn.on{background:#16261f; border-color:#16261f; color:#fff}

  /* ── detail panel ─────────────────────────────────────── */
  #panel{
    position:absolute; top:14px; right:14px; bottom:96px; width:374px; max-width:calc(100vw - 28px); z-index:7;
    background:var(--card); backdrop-filter:blur(14px); border:1px solid var(--line);
    border-radius:20px; box-shadow:var(--shadow); display:flex; flex-direction:column;
    opacity:0; transform:translateX(18px) scale(.99); pointer-events:none; transition:.28s cubic-bezier(.2,.7,.3,1);
  }
  #panel.show{opacity:1; transform:none; pointer-events:auto}
  .p-head{padding:18px 18px 14px; border-bottom:1px solid var(--line); position:relative}
  .p-badge{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:800; letter-spacing:.3px}
  .p-badge .no{font-family:var(--mono); color:#fff; background:var(--red); border-radius:6px; padding:2px 7px}
  .p-badge.amber .no{background:var(--amber)}
  .p-badge .zone{color:var(--muted); text-transform:uppercase}
  .p-title{font-size:21px; font-weight:800; letter-spacing:-.4px; margin:11px 0 0; line-height:1.22}
  .p-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:11px}
  .p-tags span{font-size:11px; font-weight:700; color:var(--green); background:color-mix(in srgb,var(--green) 11%,#fff);
    border:1px solid color-mix(in srgb,var(--green) 24%,transparent); border-radius:999px; padding:3px 9px}
  .p-close{position:absolute; top:14px; right:14px; width:30px;height:30px; border-radius:9px; border:1px solid var(--line2);
    background:#fff; cursor:pointer; display:grid; place-items:center; color:var(--muted); transition:.15s}
  .p-close:hover{color:var(--ink); border-color:var(--ink)}
  .p-body{padding:16px 18px 20px; overflow:auto; flex:1}
  .p-body::-webkit-scrollbar{width:8px} .p-body::-webkit-scrollbar-thumb{background:var(--line2); border-radius:8px}
  .p-lead{font-size:14px; line-height:1.55; color:var(--ink); font-weight:600; margin:0 0 12px}
  .p-sec{margin-top:16px}
  .p-sec h4{font-size:11px; font-weight:800; letter-spacing:.6px; color:var(--faint); text-transform:uppercase; margin:0 0 7px}
  .p-ex{font-size:13.5px; line-height:1.62; color:var(--muted); margin:0; padding:13px 14px; border-radius:13px;
    background:color-mix(in srgb,var(--amber) 9%,#fff); border:1px solid color-mix(in srgb,var(--amber) 22%,transparent)}
  .qa{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-top:8px; background:#fff}
  .qa>button{width:100%; text-align:left; appearance:none; border:0; background:transparent; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink); padding:12px 14px; display:flex; gap:9px; align-items:flex-start}
  .qa>button .q{flex:1; line-height:1.4} .qa>button .ar{color:var(--faint); transition:.2s; margin-top:2px}
  .qa.open>button .ar{transform:rotate(90deg); color:var(--green)}
  .qa .ans{max-height:0; overflow:hidden; transition:max-height .3s ease}
  .qa.open .ans{max-height:420px}
  .qa .ans-in{padding:0 14px 13px; font-size:12.8px; line-height:1.6; color:var(--muted)}
  .qa .refs{display:flex; gap:5px; flex-wrap:wrap; margin-top:9px}
  .qa .refs i{font-style:normal; font-size:10.5px; font-family:var(--mono); color:var(--green); background:color-mix(in srgb,var(--green) 9%,#fff);
    border:1px solid color-mix(in srgb,var(--green) 20%,transparent); border-radius:6px; padding:2px 6px}
  .p-foot{padding:12px 16px; border-top:1px solid var(--line); font-size:11px; color:var(--faint); line-height:1.5}

  /* hint when nothing selected */
  .hint{position:absolute; left:16px; top:16px; z-index:4; max-width:300px;
    background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; box-shadow:var(--shadow); transition:opacity .3s}
  .hint.gone{opacity:0; pointer-events:none}
  .hint b{display:block; font-size:13.5px; font-weight:800; margin-bottom:5px}
  .hint p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.5}
  .count{display:inline-flex; align-items:baseline; gap:4px; margin-top:10px; color:var(--green); font-weight:800}
  .count b{font-size:22px; line-height:1} .count span{font-size:11px; color:var(--muted); font-weight:700}

  #loading{position:absolute; inset:0; z-index:20; display:grid; place-items:center; background:#eceef0; transition:opacity .5s}
  #loading.gone{opacity:0; pointer-events:none}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2); border-top-color:var(--green); animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  @media (max-width:820px){
    #panel{top:auto; bottom:0; right:0; left:0; width:auto; max-width:none; border-radius:20px 20px 0 0;
      max-height:62vh; transform:translateY(20px)}
    #panel.show{transform:none}
    .rail-wrap{display:none}
    .brand p{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-7h6v7"/></svg>
      </div>
      <div>
        <h1>양성화<b>.com</b> · 위반건축물 3D 진단맵</h1>
        <p>3층 다가구주택 모델 위 12개 대표 위반사례 — 부위를 눌러 확인하세요</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <button class="tbtn on" id="btnRed" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>위반부위</button>
      <button class="tbtn" id="btnRotate" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>자동회전</button>
      <button class="tbtn" id="btnReset"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 1 9 9"/><path d="M3 12V7M3 12h5"/></svg>시점초기화</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="labels"></div>

    <div class="hint" id="hint">
      <b>건물의 위반 부위를 직접 짚어보세요</b>
      <p>붉은·주황으로 표시된 부위(또는 번호 핀)를 클릭하면 적발 사유·양성화 검토·연결 Q&amp;A가 열립니다. 드래그로 회전, 휠로 확대.</p>
      <span class="count"><b>12</b><span>대표 위반사례</span></span>
    </div>

    <aside id="panel" aria-live="polite">
      <div class="p-head">
        <div class="p-badge" id="pBadge"><span class="no">00</span><span class="zone">ZONE</span></div>
        <h2 class="p-title" id="pTitle">사례</h2>
        <div class="p-tags" id="pTags"></div>
        <button class="p-close" id="pClose" aria-label="닫기">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="p-body">
        <p class="p-lead" id="pShort"></p>
        <div class="p-sec">
          <h4>흔한 적발 사례</h4>
          <p class="p-ex" id="pEx"></p>
        </div>
        <div class="p-sec">
          <h4>연결 Q&amp;A</h4>
          <div id="pQa"></div>
        </div>
      </div>
      <div class="p-foot">공공데이터·건축법 기준 1차 정보입니다. 최종 양성화 가능 여부는 건축사 현장검토와 관할 지자체 기준에 따라 달라질 수 있습니다.</div>
    </aside>

    <div class="rail-wrap">
      <div class="filters" id="filters">
        <button class="fbtn on" data-f="all">전체 12</button>
        <button class="fbtn" data-f="roof">옥상부 3</button>
        <button class="fbtn" data-f="facade">외벽·발코니 4</button>
        <button class="fbtn" data-f="ground">1층·주차·용도 3</button>
        <button class="fbtn" data-f="site">구조·세대·대지 2</button>
      </div>
      <div class="rail" id="rail"></div>
    </div>

    <div id="loading"><div class="spin"></div></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ===================== DATA (qna-ui.js VIOLATIONS/QNA 원본) ===================== */
const VIOLATIONS = [
  {id:'roof-room', no:'01', zone:'roof', cat:'red', title:'옥탑방·옥상 구조물', tags:['증축','허가','옥상'],
    short:'옥상에 지붕·벽이 있는 방·창고를 올린 경우.',
    example:'3층 옥상에 컨테이너·조립식으로 방 하나를 만들어 주거·창고로 사용 — 바닥면적·층수·높이가 늘어 무단 증축으로 보기 쉬움.', qa:[1,13,14]},
  {id:'roof-pergola', no:'02', zone:'roof', cat:'amber', title:'파고라·고정 차양', tags:['증축','옥상'],
    short:'옥상에 지붕 역할을 하는 고정 구조물을 설치.',
    example:'옥상에 기둥+지붕의 파고라를 고정 설치해 사실상 실내처럼 사용 — 분리 가능한 일시 시설인지, 고정 구조인지가 갈림길.', qa:[2,13]},
  {id:'roof-service', no:'03', zone:'roof', cat:'red', title:'계단탑·물탱크실 전용', tags:['용도변경','옥상'],
    short:'설비·피난용 부속실을 주거로 사용.',
    example:'옥상 계단탑·물탱크실에 싱크대·침대를 놓고 방으로 사용 — 용도·면적·높이 문제와 무단 증축이 함께 발생.', qa:[3,13]},
  {id:'balcony', no:'04', zone:'facade', cat:'red', title:'발코니·베란다 확장', tags:['증축','구조','피난'],
    short:'대피공간·방화 기준 없이 발코니를 확장.',
    example:'3층 발코니를 새시로 막아 거실로 확장 — 면적뿐 아니라 대피공간·방화문 훼손이면 안전 문제로 본다.', qa:[4,15]},
  {id:'panel', no:'05', zone:'facade', cat:'red', title:'샷시·패널 외부 확장', tags:['증축','허가'],
    short:'벽·기둥·지붕 역할 구조로 외부를 둘러 면적 증가.',
    example:'뒷벽·측면을 경량철골+패널로 둘러 방·주방을 넓힘 — 바닥면적이 늘면 증축, 캐노피·처마와는 구분 필요.', qa:[5,13]},
  {id:'canopy', no:'06', zone:'facade', cat:'amber', title:'처마·캐노피 1m 이상', tags:['증축','건폐율'],
    short:'1m를 넘는 차양·처마는 건축면적에 산입.',
    example:'점포·현관 앞에 1m 넘는 캐노피를 설치 — 건축면적에 들어가 건폐율 초과로 이어질 수 있다.', qa:[6]},
  {id:'stair', no:'07', zone:'facade', cat:'amber', title:'외부 철골계단 증설', tags:['구조','증축'],

function tree(x,z,s=1){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.18*s,0.26*s,1.7*s,6),
    new THREE.MeshStandardMaterial({color:0x7c6a4f,roughness:.92}));
  trunk.position.y=0.85*s; trunk.castShadow=true; g.add(trunk);
  const folMat=new THREE.MeshStandardMaterial({color:0x6f9e5b,roughness:.96});
  [[0,2.1,0,1.5],[0.55,2.8,0.3,1.0],[-0.45,2.7,-0.25,0.95]].forEach(([fx,fy,fz,r])=>{
    const f=new THREE.Mesh(new THREE.IcosahedronGeometry(r*s,0), folMat);
    f.position.set(fx*s,fy*s,fz*s); f.castShadow=true; f.receiveShadow=true; g.add(f);
  });
  g.position.set(x,0,z); scene.add(g);
}

let showRed=true, filter='all', selected=null, hovered=null;
const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2();

function setEmissive(id, v){ vGroups[id].mat.emissiveIntensity = v; }
function refresh(){
  Object.entries(vGroups).forEach(([id,g])=>{
    const inFilter = (filter==='all' || g.data.zone===filter);
    // 위반표시 off거나 필터 밖이면 → 골조색으로 빼고 핀 숨김(매칭만 또렷하게)
    const neutral = !showRed || !inFilter;
    g.mat.color.setHex(neutral ? 0xcabfb0 : CAT[g.data.cat].color);
    setEmissive(id, neutral ? 0.0 : (id===selected ? 0.95 : 0.46));
    g.mat.transparent = false; g.mat.opacity = 1;
    g.el.classList.toggle('hide', neutral);
    g.el.classList.toggle('sel', id===selected);
  });
  document.querySelectorAll('.chip').forEach(c=>{
    const z = VMAP[c.dataset.id].zone;
    c.classList.toggle('dim', filter!=='all' && z!==filter);
    c.classList.toggle('sel', c.dataset.id===selected);
  });
}

const panel=document.getElementById('panel'), hint=document.getElementById('hint');
function select(id, focus){
  selected=id; const d=VMAP[id];
  document.getElementById('pBadge').className = 'p-badge '+(d.cat==='amber'?'amber':'');
  document.getElementById('pBadge').innerHTML = `<span class="no">${d.no}</span><span class="zone">${ZONE_LABEL[d.zone]}</span>`;
  document.getElementById('pTitle').textContent = d.title;
  document.getElementById('pTags').innerHTML = d.tags.map(t=>`<span>${t}</span>`).join('');
  document.getElementById('pShort').textContent = d.short;
  document.getElementById('pEx').textContent = d.example;
  document.getElementById('pQa').innerHTML = d.qa.map(qid=>{
    const q=QMAP[qid]; if(!q) return '';
    return `<div class="qa"><button type="button" data-qa><span class="q">${q.q}</span><span class="ar">▸</span></button>
      <div class="ans"><div class="ans-in">${q.a}<div class="refs">${q.refs.map(r=>`<i>${r}</i>`).join('')}</div></div></div>`;
  }).join('');
  document.querySelectorAll('#pQa [data-qa]').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('open')));
  panel.classList.add('show'); hint.classList.add('gone');

// 포인터
function setPointer(e){ const r=canvas.getBoundingClientRect(); pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1; }
canvas.addEventListener('pointermove', e=>{
  setPointer(e);
  raycaster.setFromCamera(pointer,camera);
  const hit = showRed ? raycaster.intersectObjects(pickables,false)[0] : null;
  const id = hit?.object.userData.vid || null;
  const valid = id && (filter==='all'||VMAP[id].zone===filter);
  canvas.style.cursor = valid ? 'pointer' : 'grab';
  if(hovered && hovered!==selected) setEmissive(hovered, showRed && (filter==='all'||VMAP[hovered].zone===filter)?0.32:0);
  hovered = valid ? id : null;
  if(hovered && hovered!==selected) setEmissive(hovered, 0.7);
});
let downXY=null;
canvas.addEventListener('pointerdown', e=>{ downXY=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup', e=>{
  if(!downXY) return; const moved=Math.abs(e.clientX-downXY[0])+Math.abs(e.clientY-downXY[1]);
  downXY=null; if(moved>5||!showRed) return;
  setPointer(e); raycaster.setFromCamera(pointer,camera);
  const hit = raycaster.intersectObjects(pickables,false)[0];
  const id = hit?.object.userData.vid;
  if(id && (filter==='all'||VMAP[id].zone===filter)) select(id,true); else if(!id) deselect();
});

// 주의: setPointerCapture를 쓰면 click이 칩이 아니라 레일로 가서 select가 안 불림 → window 리스너로 처리.
(function railScroll(){
  let down=false, moved=false, sx=0, sl=0;
  rail.addEventListener('pointerdown', e=>{ if(e.button!==0) return; down=true; moved=false; sx=e.clientX; sl=rail.scrollLeft; });
  window.addEventListener('pointermove', e=>{ if(!down) return; const dx=e.clientX-sx; if(Math.abs(dx)>4){ if(!moved){ moved=true; rail.classList.add('grabbing'); } rail.scrollLeft=sl-dx; } });
  window.addEventListener('pointerup', ()=>{ if(!down) return; down=false; rail.classList.remove('grabbing'); });
  rail.addEventListener('click', e=>{ if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; } }, true); // 드래그였으면 칩 클릭 억제
  rail.addEventListener('wheel', e=>{ if(e.deltaY){ rail.scrollLeft+=e.deltaY; e.preventDefault(); } }, {passive:false});
})();

let flyCam = {from:new THREE.Vector3(30,26,38), to:HOME.pos.clone(), t:0};
camera.position.copy(flyCam.from);
const ease=t=>1-Math.pow(1-t,3);
function resize(){
  const w=stage.clientWidth, h=stage.clientHeight;
  renderer.setSize(w,h,false); labelRenderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

let last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last); last=now;
  if(flyCam){ flyCam.t=Math.min(1,flyCam.t+dt/1300); camera.position.lerpVectors(flyCam.from,flyCam.to,ease(flyCam.t)); if(flyCam.t>=1)flyCam=null; }
  if(fly){ fly.t=Math.min(1,fly.t+dt/700); controls.target.lerpVectors(fly.from,fly.to,ease(fly.t)); if(fly.t>=1)fly=null; }
  // 선택한 위반 메쉬만 맥동(살아있는 강조) — 핀 펄스 링과 한 쌍. 나머지는 정적.
  if(showRed){
    const p = 0.5 + 0.5*Math.sin(now*0.0042); // 0..1, ~1.5s 주기
    for(const id in vGroups){
      const g=vGroups[id];
      if(filter!=='all' && g.data.zone!==filter) continue; // 필터 밖(골조색)은 제외
      g.mat.emissiveIntensity = id===selected ? (0.45+0.85*p)  // 선택만 펄스
                              : id===hovered  ? 0.85
                              : 0.46;                          // 비선택은 정적
    }
  }
  controls.update();
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
  requestAnimationFrame(loop);
}
refresh();
requestAnimationFrame(loop);
setTimeout(()=>document.getElementById('loading').classList.add('gone'), 350);
</script>
</body>
